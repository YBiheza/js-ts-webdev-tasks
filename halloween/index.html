<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halloween</title>
    <link rel="stylesheet" href="./src/styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Jolly+Lodger&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Jolly+Lodger&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">  
</head>
  <body>
    <header class="header" data-i18n>
      <div class="logo">
        <p class="logo" data-i18n="logo">
      </div>
      <ul class="menu">
        <li class="menu-item menu-item-first" data-i18n="menu-item-first"></li>
        <li class="menu-item menu-item-second" data-i18n="menu-item-second"></li>
        <li class="menu-item menu-item-third" data-i18n="menu-item-third"></li>
        <li class="menu-item menu-item-fourth" data-i18n="menu-item-fourth"></li>
        <li class="menu-item menu-item-fifth" data-i18n="menu-item-fifth"></li>
      </ul>
      <div class="localization">
        <p class="localization loc-en">EN</p>
        <p class="localization loc-ar">عرب</p>
      </div>
      <div class="reservation">
        <p class="reservation-button" data-i18n="reserv-button"></p>
      </div>
    </header>
    <main class="main">
      <section class="hero">
        <div class="date-block">
          <img src="./src/images/calendar.png" alt="" class="date-calendar">
          <p class="date" data-i18n="date"></p>
        </div>
        <div class="title title-hero">
          <h1 class="title-text" data-i18n="title-header"></h1>
        </div>
        <img src="./src/images/arrow-down.png" alt="arrow-down" class="arrow-down">
      </section>
      <section class="gallery">
        <div class="title title-gallery">
          <h2 class="title-text" data-i18n="title-gallery"></h2>
        </div>
        <div class="container">
          <img src="./src/images/image01.png" alt="" class="pic">
          <img src="./src/images/image02.png" alt="" class="pic">
          <img src="./src/images/image03.png" alt="" class="pic">
          <img src="./src/images/image04.png" alt="" class="pic">
          <img src="./src/images/image05.png" alt="" class="pic">
          <img src="./src/images/image06.png" alt="" class="pic">
          <img src="./src/images/image07.png" alt="" class="pic">
          <img src="./src/images/image08.png" alt="" class="pic">
          <img src="./src/images/image09.png" alt="" class="pic">
          <img src="./src/images/image10.png" alt="" class="pic">
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer-title title">
        <h2 class="title-text" data-i18n="title-footer"></h2>
      </div>
      <div class="smm">
        <img src="./src/images/behance.png" alt="" class="icon">
        <img src="./src/images/Figma.png" alt="" class="icon">
        <img src="./src/images/LinkedIn.png" alt="" class="icon">
        <img src="./src/images/instagram.png" alt="" class="icon">
        <img src="./src/images/youtube.png" alt="" class="icon">
      </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
